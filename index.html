<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayBox</title>
    <meta name="description" content="설치 없이 브라우저에서 바로 즐기는 미니 게임 모음. 로봇청소기 미로 게임 Maze Escape를 지금 플레이하세요." />
    <link rel="canonical" href="https://play-box.cloud/" />
    <meta name="google-adsense-account" content="ca-pub-3773338858328945" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3773338858328945" crossorigin="anonymous"></script>
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlayBox" />
    <meta property="og:url" content="https://play-box.cloud/" />
    <meta property="og:title" content="PlayBox - 브라우저 미니 게임" />
    <meta property="og:description" content="설치 없이 브라우저에서 바로 즐기는 미니 게임 모음" />
    <meta property="og:image" content="https://play-box.cloud/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "PlayBox",
            "url": "https://play-box.cloud/",
            "inLanguage": "ko"
          },
          {
            "@type": "ItemList",
            "name": "PlayBox 게임 목록",
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "name": "Maze Escape", "url": "https://play-box.cloud/maze-escape/" },
              { "@type": "ListItem", "position": 2, "name": "Mole Patch", "url": "https://play-box.cloud/mole-patch/" }
            ]
          }
        ]
      }
    </script>
    <link rel="stylesheet" href="/page.css" />
    <style>
      .banner { margin: 0; }
      .banner img { display: block; width: 100%; height: auto; border-radius: 16px; }
      .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 280px)); gap: 16px; margin-top: 24px; }
      .game { display: flex; flex-direction: column; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(59, 47, 42, 0.12); transition: transform 0.15s; }
      .game > a { color: inherit; text-decoration: none; }
      .game a.about { margin: auto 16px 0; padding: 10px 0 14px; border-top: 1px solid #e6d9c2; color: var(--accent); font-size: 14px; font-weight: 700; }
      .game:hover { transform: translateY(-2px); }
      .game img { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 630; object-fit: cover; }
      .game div { padding: 12px 16px; }
      .game h2 { margin: 0 0 4px; padding: 0; border: 0; font-size: 18px; }
      .game p { margin: 0; color: var(--muted); font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1 class="banner">
        <picture>
          <source media="(max-width: 600px)" srcset="/banner-mobile.jpg" width="840" height="472" />
          <img src="/banner.jpg" alt="PlayBox - 심심할 땐 미니게임 모음집" width="1500" height="500" />
        </picture>
      </h1>

      <section class="games">
        <article class="game">
          <a href="/maze-escape/">
            <img src="/maze-escape/og-image.jpg" alt="로봇청소기가 고양이들을 피해 미로 같은 집 안을 청소하는 장면" width="1200" height="630" />
            <div>
              <h2>Maze Escape</h2>
              <p>고양이를 피해 집 안의 먼지를 모두 치우는 로봇청소기 미로 게임</p>
            </div>
          </a>
          <a class="about" href="/maze-escape/about/">게임 소개 →</a>
        </article>
        <article class="game">
          <a href="/mole-patch/">
            <img src="/mole-patch/og-image.jpg" alt="허수아비와 숫자 팻말이 꽂힌 텃밭에서 두더지들이 굴 밖으로 고개를 내민 장면" width="1200" height="630" />
            <div>
              <h2>Mole Patch</h2>
              <p>두더지 굴을 피해 텃밭을 모두 일구는 지뢰찾기 퍼즐 게임</p>
            </div>
          </a>
          <a class="about" href="/mole-patch/about/">게임 소개 →</a>
        </article>
      </section>

      <footer>
        <a href="/about/">PlayBox 소개</a> · <a href="/privacy/">개인정보처리방침</a>
      </footer>
    </main>
  </body>
</html>
